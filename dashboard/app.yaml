command:
  - "python"
  - "app.py"

resources:
  - name: requirements
    source:
      path: ./requirements.txt

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "trip_planner"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: EMBEDDING_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: TRIP_PIPELINE_JOB_ID
    value: "877854758643169"
  - name: DEFAULT_USER_EMAIL
    value: "demo@example.com"
